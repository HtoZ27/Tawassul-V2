name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    name: windows-${{ matrix.mode }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode:
          - cycle
          - pwsh7
          - longpath
          - ast
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build the bundle and the index
        run: bun build-v2.mjs

      - name: Run the Windows lane
        shell: powershell
        run: ./scripts/windows-ci.ps1 -Mode ${{ matrix.mode }} -Log "$env:RUNNER_TEMP\windows-ci-${{ matrix.mode }}.log"

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.mode }}
          path: ${{ runner.temp }}\windows-ci-*.log
          if-no-files-found: warn
