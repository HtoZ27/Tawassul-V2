name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: fast gate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          cache: npm
      - name: Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install
        run: npm ci
      - name: Rules
        run: npm run check:rules
      - name: Docs
        run: npm run check:docs
      - name: Fast gate
        run: npm run gate:fast
      - name: Build
        run: npm run build

  proofs:
    name: proofs shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
          cache: npm
      - name: Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y sqlite3 psmisc jq
      - name: Install
        run: npm ci
      - name: Host CLI
        if: matrix.shard == 4
        run: |
          mkdir -p "$RUNNER_TEMP/host-cli"
          cd "$RUNNER_TEMP/host-cli"
          npm init -y >/dev/null
          npm i --no-audit --no-fund @opencode/cli@2.3.0
          echo "TAWASSUL_OPENCODE_BIN=$RUNNER_TEMP/host-cli/node_modules/.bin/opencode" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Proofs
        run: npm run gate:proofs:${{ matrix.shard }}
